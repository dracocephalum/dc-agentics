# Settings that agents read before acting in this repository - the toolkit
# itself, so no provenance and no repository block. The shipped shape is
# init/repo/payload/.dc-agentics.yaml.

change-tracking:
  # init/repo/payload/docs/rules/change-tracking/change-tracking.md
  tracker: github-issues
  board: https://github.com/users/dracocephalum/projects/1
  board-auto-add: false               # the agent adds each ticket it creates; flip to true once the board's workflows are on

source-control:
  # auto | local | manual - docs/rules/source-control/source-control.md
  # (here: init/repo/payload/docs/rules/source-control/source-control.md), "For an agent".
  mode: auto
