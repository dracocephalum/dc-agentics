# Settings that agents read before acting in this repository - the toolkit
# itself, so no provenance, and a repository block holding only publish-safe.
# The shipped shape is repo/payload/.agentics.yaml.

repository:
  # repo/payload/agentics/rules/security-reminders.md, "Names that are not yours
  # to publish". This repository is public: other repositories - the reference
  # repositories the procedures are tested against included - are referred to
  # by role, never by name.
  publish-safe: true

change-tracking:
  # repo/payload/agentics/rules/change-tracking/change-tracking.md
  tracker: github-issues

source-control:
  # auto | local | manual - agentics/rules/source-control/source-control.md
  # (here: repo/payload/agentics/rules/source-control/source-control.md), "For an agent".
  mode: auto

support:
  # The oldest toolkit commit an upgrade will take a repository FROM. A target
  # whose recorded commit predates this is declined with "re-initialize" - see
  # repo/version-check.md. Set when the layout settled (machine/ + repo/,
  # agentics/ in the payload, .agentics.yaml, one ruleset); nobody had
  # initialized from an older state, so nothing older is carried.
  baseline: "b2e45957bb5a"

guidelines:
  # The model line agentics/rules were written and verified against - see "A note on
  # models" in README.md. This records what they say AND what they leave unsaid
  # because these models do it by default. Not a requirement: another model
  # works, but the rules it does not infer are the ones it will miss.
  #
  # It exists so that strange behaviour after a model change has something to be
  # compared against. Same idea as agentics-verified on the test stack: a
  # combination known to have worked together, and when.
  model-baseline: "claude-opus-5, claude-fable-5-1"
  verified: "2026-09-07"              # last end-to-end initialization trial on that line
